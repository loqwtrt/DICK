<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DICK</title>
    <style>
        /* Previous styles remain the same */
        
        /* Add these new styles for language selector */
        .language-selector {
            position: relative;
            margin-left: 20px;
        }
        
        .language-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: rgba(255, 255, 255, 0.8);
            padding: 8px 15px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }
        
        .language-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }
        
        .language-btn i {
            font-size: 14px;
        }
        
        .language-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            background: #2d3436;
            border-radius: 10px;
            padding: 10px 0;
            width: 200px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            z-index: 100;
            display: none;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .language-dropdown.show {
            display: block;
            animation: fadeIn 0.2s;
        }
        
        .language-option {
            padding: 8px 20px;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            display: block;
            transition: all 0.2s;
        }
        
        .language-option:hover {
            background: rgba(0, 158, 153, 0.3);
            color: white;
        }
        
        /* Light theme adjustments */
        body.light-theme .language-btn {
            background: rgba(0, 0, 0, 0.05);
            color: #555;
        }
        
        body.light-theme .language-btn:hover {
            background: rgba(0, 0, 0, 0.1);
            color: #000;
        }
        
        body.light-theme .language-dropdown {
            background: #f5f6fa;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        body.light-theme .language-option {
            color: #555;
        }
        
        body.light-theme .language-option:hover {
            background: rgba(0, 158, 153, 0.1);
            color: #000;
        }
    </style>
</head>
<body>
    <!-- Previous content remains the same until the header section -->
    
    <!-- Header -->
    <header>
        <div class="container header-content">
            <a href="#" class="logo">DI<span>CK</span></a>
            <nav>
                <ul>
                    <li><a href="#">Игры</a></li>
                    <li><a href="#" class="download-btn">Скачать</a></li>
                    <li>
                        <div class="language-selector">
                            <button class="language-btn">
                                <i class="fas fa-globe"></i> Русский
                                <i class="fas fa-chevron-down"></i>
                            </button>
                            <div class="language-dropdown" id="languageDropdown">
                                <a href="#" class="language-option">English</a>
                                <a href="#" class="language-option">Українська</a>
                                <a href="#" class="language-option">Polski</a>
                                <a href="#" class="language-option">Deutsch</a>
                                <a href="#" class="language-option">Italiano</a>
                                <a href="#" class="language-option">Türk</a>
                                <a href="#" class="language-option">Español</a>
                                <a href="#" class="language-option">中文</a>
                                <a href="#" class="language-option">اللغة العربية</a>
                                <a href="#" class="language-option">Português</a>
                                <a href="#" class="language-option">Français</a>
                                <a href="#" class="language-option">O'zbek</a>
                                <a href="#" class="language-option">Qazaq</a>
                                <a href="#" class="language-option">Română</a>
                                <a href="#" class="language-option">Tiếng Việt</a>
                                <a href="#" class="language-option">Česky</a>
                                <a href="#" class="language-option">Indonesian</a>
                                <a href="#" class="language-option">Монголский</a>
                                <a href="#" class="language-option">한국어</a>
                                <a href="#" class="language-option">Русский</a>
                            </div>
                        </div>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Rest of your HTML content remains the same -->

    <script>
        // Previous JavaScript remains the same
        
        // Add this for language selector functionality
        document.addEventListener('DOMContentLoaded', function() {
            // Language selector
            const languageBtn = document.querySelector('.language-btn');
            const languageDropdown = document.getElementById('languageDropdown');
            
            languageBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                languageDropdown.classList.toggle('show');
            });
            
            // Close dropdown when clicking outside
            document.addEventListener('click', function(e) {
                if (!e.target.closest('.language-selector')) {
                    languageDropdown.classList.remove('show');
                }
            });
            
            // Language selection
            document.querySelectorAll('.language-option').forEach(option => {
                option.addEventListener('click', function(e) {
                    e.preventDefault();
                    const lang = this.textContent;
                    languageBtn.innerHTML = `<i class="fas fa-globe"></i> ${lang} <i class="fas fa-chevron-down"></i>`;
                    languageDropdown.classList.remove('show');
                    // Here you would typically change the language of the page
                    alert(`Language changed to ${lang}. In a real app, this would trigger translation.`);
                });
            });
        });
    </script>
</body>
</html>
